name: Registry

# The registry section of README.md is generated. This workflow keeps it true:
# every hour, on any repository event relayed from the organization webhook
# (relay/README.md), and by hand. On pull requests it only verifies.

on:
  schedule:
    - cron: '17 * * * *'
  repository_dispatch:
    types: [org-repo]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'registry/**'
      - '.github/workflows/registry.yml'
  pull_request:
    paths:
      - 'registry/**'
      - 'README.md'
      - '.github/workflows/registry.yml'

permissions:
  contents: write

concurrency:
  group: registry
  cancel-in-progress: false

jobs:
  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: nu {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: ${{ github.event_name != 'pull_request' }}

      - uses: hustcer/setup-nu@9215c80adb545a85c419d5085b76eb6d082f49e7 # v3.27
        with:
          version: '0.112.2'

      - name: Event
        run: |
          print $"event: ($env.GITHUB_EVENT_NAME)"
          if $env.GITHUB_EVENT_NAME == "repository_dispatch" {
            let p = open $env.GITHUB_EVENT_PATH | get client_payload
            print $"relayed: ($p | to json -r)"
          }

      - name: Lint
        run: nu registry/registry.nu lint | save --append $env.GITHUB_STEP_SUMMARY

      - name: Check
        id: check
        continue-on-error: true
        run: nu registry/registry.nu check

      - name: Update
        if: steps.check.outcome == 'failure' && github.event_name != 'pull_request'
        run: |
          nu registry/registry.nu update
          ^git config user.name "registry"
          ^git config user.email "registry@users.noreply.github.com"
          ^git add README.md
          let reason = if $env.GITHUB_EVENT_NAME == "repository_dispatch" {
            let p = open $env.GITHUB_EVENT_PATH | get client_payload
            $"($p.action) ($p.repository)"
          } else { $env.GITHUB_EVENT_NAME }
          ^git commit -m $"chore: registry sync \(($reason)\)"
          ^git push
          "registry: README.md updated and pushed\n" | save --append $env.GITHUB_STEP_SUMMARY

      - name: Verify
        if: steps.check.outcome == 'failure' && github.event_name == 'pull_request'
        run: |
          "registry: README.md is stale — run `nu registry/registry.nu update` and commit\n" | save --append $env.GITHUB_STEP_SUMMARY
          exit 1

      - name: Report
        if: steps.check.outcome == 'success'
        run: '"registry: README.md matches the organization\n" | save --append $env.GITHUB_STEP_SUMMARY'
